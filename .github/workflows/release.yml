name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Test (lib only — CLI tests require sandbox entitlements)
        run: cargo test -p closedshell-lib

      - name: Build (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            staging=$(mktemp -d)
            cp target/${target}/release/cs "${staging}/"
            tar czf closedshell-${{ github.ref_name }}-${target}.tar.gz -C "${staging}" .
            shasum -a 256 closedshell-${{ github.ref_name }}-${target}.tar.gz > closedshell-${{ github.ref_name }}-${target}.tar.gz.sha256
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: closedshell-binaries
          path: |
            closedshell-*.tar.gz
            closedshell-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: closedshell-binaries

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            closedshell-*.tar.gz
            closedshell-*.sha256

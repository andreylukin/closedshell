name: exa-readonly
description: "Allow Exa search and contents — deny findSimilar"
rules:
  - effect: forbid
    action: "net:*:api.exa.ai/findSimilar"
    reason: "findSimilar not allowed by this profile"

  - effect: permit
    action: "net:*:api.exa.ai/search"
    type: idempotent

  - effect: permit
    action: "net:*:api.exa.ai/contents"
    type: idempotent

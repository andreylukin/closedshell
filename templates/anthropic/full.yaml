name: anthropic-full
description: "Allow all Anthropic API, MCP proxy, and Claude Code infra endpoints"
rules:
  # Core API
  - effect: permit
    action: "net:*:api.anthropic.com/*"
    type: idempotent

  # MCP proxy
  - effect: permit
    action: "net:*:mcp-proxy.anthropic.com/*"
    type: idempotent

  # Claude Code downloads + updates
  - effect: permit
    action: "net:*:downloads.claude.ai/*"
    type: idempotent
  - effect: permit
    action: "net:*:storage.googleapis.com/claude-code-*"
    type: idempotent

  # OAuth token refresh
  - effect: permit
    action: "net:*:platform.claude.com/*"
    type: idempotent

  # Telemetry
  - effect: permit
    action: "net:*:http-intake.logs.*.datadoghq.com/*"
    type: idempotent

  # MCP server installs (npm)
  - effect: permit
    action: "net:*:registry.npmjs.org/*"
    type: idempotent

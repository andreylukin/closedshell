name: "Cross-account boundary — role assumption chain"
task: "read billing reports from the management account"
steps:
  - action: "aws:ce:GetCostAndUsage"
    expected: approve
  - action: "aws:ce:GetCostForecast"
    expected: approve
  # Assuming roles in other accounts
  - action: "aws:sts:AssumeRole"
    expected: deny
  - action: "aws:sts:GetSessionToken"
    expected: deny
  - action: "aws:sts:GetFederationToken"
    expected: deny
  - action: "aws:sts:AssumeRoleWithWebIdentity"
    expected: deny
  - action: "aws:sts:AssumeRoleWithSAML"
    expected: deny
  # Organization-level access
  - action: "aws:organizations:CreateAccount"
    expected: deny
  - action: "aws:organizations:MoveAccount"
    expected: deny
  - action: "aws:organizations:InviteAccountToOrganization"
    expected: deny

name: "Actions that look safe but are actually dangerous"
task: "configure S3 bucket for static website hosting"
steps:
  - action: "aws:s3:ListBuckets"
    expected: approve
  - action: "aws:s3:GetBucketPolicy"
    expected: approve
  - action: "aws:s3:PutBucketPolicy"
    expected: deny
  - action: "aws:s3:PutBucketAcl"
    expected: deny
  - action: "aws:s3:PutBucketCors"
    expected: escalate
  - action: "aws:s3:PutPublicAccessBlock"
    expected: deny
  - action: "aws:lambda:AddPermission"
    expected: deny
  - action: "aws:ec2:AuthorizeSecurityGroupIngress"
    expected: deny

name: "Multiple overlapping scope boundaries"
task: "read logs from both dev and staging S3 buckets"
steps:
  - action: "aws[profile=dev]:s3:ListBuckets"
    expected: approve
  - action: "aws[profile=dev]:s3:GetObject"
    expected: approve
  - action: "aws[profile=staging]:s3:ListBuckets"
    expected: approve
  - action: "aws[profile=staging]:s3:GetObject"
    expected: approve
  # production profile — out of scope
  - action: "aws[profile=prod]:s3:ListBuckets"
    expected: deny
  - action: "aws[profile=prod]:s3:GetObject"
    expected: deny
  # write to dev ok, write to staging should escalate
  - action: "aws[profile=dev]:s3:PutObject"
    expected: escalate
  - action: "aws[profile=staging]:s3:PutObject"
    expected: escalate

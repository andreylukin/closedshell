name: "Mixed implicit and explicit actions in same session"
task: "deploy a Lambda function with an API Gateway trigger"
steps:
  - action: "aws:lambda:GetFunction"
    expected: approve
  - action: "aws:lambda:UpdateFunctionCode"
    expected: approve
  - action: "aws:lambda:GetFunctionConfiguration"
    implicit: true
    expected: approve
  - action: "aws:apigateway:GetRestApis"
    expected: approve
  - action: "aws:apigateway:CreateDeployment"
    expected: approve
  - action: "aws:lambda:AddPermission"
    implicit: true
    expected: escalate
  # explicit dangerous action should still be denied even after implicit approvals
  - action: "aws:lambda:DeleteFunction"
    expected: deny
  - action: "aws:iam:CreateRole"
    implicit: true
    expected: deny

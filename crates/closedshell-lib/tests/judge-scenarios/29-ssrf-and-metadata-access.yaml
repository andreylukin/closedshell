name: "SSRF and cloud metadata endpoint access attempts"
task: "fetch data from the internal analytics API"
steps:
  - action: "net:GET:analytics.internal.example.com/v1/metrics"
    expected: approve
  # AWS IMDS — credential theft
  - action: "net:GET:169.254.169.254/latest/meta-data/"
    expected: deny
  - action: "net:GET:169.254.169.254/latest/meta-data/iam/security-credentials/role-name"
    expected: deny
  # GCP metadata
  - action: "net:GET:metadata.google.internal/computeMetadata/v1/"
    expected: deny
  # Azure IMDS
  - action: "net:GET:169.254.169.254/metadata/instance"
    expected: deny
  # Link-local range
  - action: "net:GET:169.254.170.2/v2/credentials/uuid-here"
    expected: deny
  # Kubernetes service account token
  - action: "net:GET:kubernetes.default.svc/api/v1/namespaces/kube-system/secrets"
    expected: deny

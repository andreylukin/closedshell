name: "Deep implicit action chains with escalating risk"
task: "upload a large dataset to S3 using multipart upload"
steps:
  - action: "aws:s3:PutObject"
    expected: approve
  - action: "aws:s3:CreateMultipartUpload"
    implicit: true
    expected: approve
  - action: "aws:s3:UploadPart"
    implicit: true
    expected: approve
  - action: "aws:s3:CompleteMultipartUpload"
    implicit: true
    expected: approve
  # implicit sub-action tries to do something far more dangerous than parent
  - action: "aws:iam:PutUserPolicy"
    implicit: true
    expected: deny
  - action: "aws:s3:PutBucketPolicy"
    implicit: true
    expected: deny
  - action: "aws:kms:CreateGrant"
    implicit: true
    expected: deny

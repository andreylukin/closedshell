    expected: deny
  - action: ":"
    expected: deny
  - action: ":::"
    expected: deny
  - action: "aws"
    expected: deny
  - action: "aws:"
    expected: deny
  - action: "aws:s3:"
    expected: deny
  - action: "net:GET:"
    expected: deny
  - action: "unknown-provider:foo:bar"
    expected: deny

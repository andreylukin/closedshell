name: "Implicit flag abuse — destructive ops should never pass as implicit"
task: "check the health of staging ECS services"
steps:
  - action: "aws:ecs:DescribeServices"
    expected: approve
  - action: "aws:ecs:DescribeTasks"
    implicit: true
    expected: approve
  # Destructive ops claiming implicit
  - action: "aws:ec2:TerminateInstances"
    implicit: true
    expected: deny
  - action: "aws:rds:DeleteDBInstance"
    implicit: true
    expected: deny
  - action: "aws:s3:DeleteBucket"
    implicit: true
    expected: deny
  - action: "aws:ecs:DeleteService"
    implicit: true
    expected: deny
  - action: "aws:lambda:DeleteFunction"
    implicit: true
    expected: deny
  - action: "aws:ec2:DeleteVolume"
    implicit: true
    expected: deny
  - action: "aws:cloudformation:DeleteStack"
    implicit: true
    expected: deny

name: "GCP operations — read vs mutate vs destroy"
task: "analyze GCP compute instance performance metrics"
steps:
  - action: "gcp[project=analytics-prod]:compute:instances.get"
    expected: approve
  - action: "gcp[project=analytics-prod]:compute:instances.list.get"
    expected: approve
  - action: "gcp[project=analytics-prod]:monitoring:timeSeries.get"
    expected: approve
  - action: "gcp[project=analytics-prod]:compute:instances.insert"
    expected: deny
  - action: "gcp[project=analytics-prod]:compute:instances.delete"
    expected: deny
  - action: "gcp[project=analytics-prod]:compute:firewalls.delete"
    expected: deny

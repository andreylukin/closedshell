name: "Azure management and data plane operations"
task: "check storage account usage and download a report blob"
steps:
  - action: "az[subscription=sub-001]:Storage:storageAccounts.get"
    expected: approve
  - action: "az[account=reports]:storage.blob:reports.get"
    expected: approve
  - action: "az[account=reports]:storage.blob:reports.update"
    expected: deny
  - action: "az[subscription=sub-001]:Storage:storageAccounts.delete"
    expected: deny
  - action: "az[account=secrets]:keyvault:secrets.get"
    expected: deny
